name: Optional Azure Infrastructure
on:
  workflow_dispatch:
    inputs:
      apply:
        type: boolean
        default: false
        description: Apply the saved plan after protected environment approval
permissions:
  contents: read
concurrency:
  group: azure-infrastructure
  cancel-in-progress: false
env:
  ARM_USE_OIDC: 'true'
  ARM_USE_AZUREAD: 'true'
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_name: ${{ vars.AZURE_RESOURCE_PREFIX }}
  TF_VAR_admin_group_object_ids: ${{ vars.AZURE_ADMIN_GROUP_IDS_JSON }}
jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: azure-plan
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.16.4'
      - name: Plan
        env:
          STATE_RG: ${{ vars.TF_STATE_RESOURCE_GROUP }}
          STATE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
        run: |
          terraform -chdir=terraform/azure init -input=false -lockfile=readonly \
            -backend-config="resource_group_name=$STATE_RG" \
            -backend-config="storage_account_name=$STATE_ACCOUNT" \
            -backend-config=container_name=tfstate -backend-config=key=ai-infra-ops.tfstate
          terraform -chdir=terraform/azure plan -input=false -out=approved.tfplan
          terraform -chdir=terraform/azure show -no-color approved.tfplan
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reviewed-plan
          path: terraform/azure/approved.tfplan
          retention-days: 1
  apply:
    needs: plan
    if: inputs.apply && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: azure-apply
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reviewed-plan
          path: terraform/azure
      - uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.16.4'
      - name: Apply exact reviewed plan
        env:
          STATE_RG: ${{ vars.TF_STATE_RESOURCE_GROUP }}
          STATE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
        run: |
          terraform -chdir=terraform/azure init -input=false -lockfile=readonly \
            -backend-config="resource_group_name=$STATE_RG" \
            -backend-config="storage_account_name=$STATE_ACCOUNT" \
            -backend-config=container_name=tfstate -backend-config=key=ai-infra-ops.tfstate
          terraform -chdir=terraform/azure apply -input=false approved.tfplan