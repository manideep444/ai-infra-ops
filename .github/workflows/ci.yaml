name: Quality and Integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.13.10'
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: make check
      - run: uv run pip-audit --local --skip-editable
      - run: uv build
      - run: uv run airp init-demo && uv run airp demo --approve-demo
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mock-evidence-${{ matrix.python }}
          path: .state/reports/
          include-hidden-files: true
          retention-days: 7
  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.16.4'
      - run: terraform -chdir=terraform/azure fmt -check
      - run: terraform -chdir=terraform/azure init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=terraform/azure validate
      - run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/kubeconform" -strict -summary -skip Cluster kubernetes/
          "$(go env GOPATH)/bin/actionlint"
          shellcheck scripts/*.sh
      - run: az bicep install --version v0.34.44
      - run: az bicep build --file bicep/monitoring.bicep --stdout > /dev/null
  kind:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.13.10'
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.18.6
      - run: go install sigs.k8s.io/kind@v0.31.0
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make setup kind-up
      - run: AIRP_TEST_KIND=1 uv run pytest tests/test_kind.py -v
      - name: Failure diagnostics
        if: failure()
        run: |
          kubectl --context kind-airp get pods -A
          kubectl --context kind-airp -n airp-demo describe deployment demo-web
          kubectl --context kind-airp -n airp-system logs deployment/airp-admission --tail=80
      - name: Teardown
        if: always()
        run: kind delete cluster --name airp
  observability:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      COMPOSE_FILE: observability/compose.yaml
      COMPOSE_PROJECT_NAME: airp-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate configuration
        run: |
          mkdir -p .state/telemetry
          printf 'airp_ci_fixture 1\n' > .state/telemetry/ci.prom
          docker compose config --quiet
          docker compose run --rm --entrypoint promtool prometheus check config /etc/prometheus/prometheus.yml
          docker compose run --rm collector validate --config=/etc/otelcol/config.yaml
      - name: Start and verify the stack
        run: |
          docker compose up -d
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:9090/-/ready
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:3000/api/health |
            jq -e '.database == "ok"'
          curl --fail http://127.0.0.1:3000/api/dashboards/uid/airp |
            jq -e '.dashboard.uid == "airp"'
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 \
            -H 'Content-Type: application/json' -d '{"resourceSpans":[]}' \
            http://127.0.0.1:4318/v1/traces
          for attempt in $(seq 1 30); do
            if curl --fail --get --data-urlencode 'query=airp_ci_fixture' \
              http://127.0.0.1:9090/api/v1/query |
              jq -e '.status == "success" and (.data.result | length == 1) and .data.result[0].value[1] == "1"'; then
              exit 0
            fi
            echo "Waiting for Prometheus scrape ($attempt/30)"
            sleep 2
          done
          echo 'Prometheus did not scrape the node-exporter textfile fixture' >&2
          exit 1
      - name: Failure diagnostics
        if: failure()
        run: docker compose logs --no-color --tail 80
      - name: Teardown
        if: always()
        run: docker compose down --volumes