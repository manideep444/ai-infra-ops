apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-web
  namespace: airp-demo
data:
  index.html: |
    <!doctype html><html lang="en"><title>Fictional Demo Service</title>
    <body><h1>Fictional Demo Service</h1><p>Healthy</p></body></html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-web
  namespace: airp-demo
  labels:
    app: demo-web
    airp.demo/intentional-finding: token-automount
spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: demo-web
  template:
    metadata:
      labels:
        app: demo-web
    spec:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.29-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DEMO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: demo-runtime
                  key: token
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: content
          configMap:
            name: demo-web
        - name: temporary
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-web
  namespace: airp-demo
spec:
  selector:
    app: demo-web
  ports:
    - port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: demo-web
  namespace: airp-demo
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: demo-web