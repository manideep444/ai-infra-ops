[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-infra-ops"
version = "0.1.0"
description = "Evidence-driven infrastructure remediation with constrained AI and human approval"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "mcp>=1.26,<2",
  "openai>=2.0,<4",
  "kubernetes>=35,<36",
  "prometheus-client>=0.24,<1",
  "opentelemetry-api>=1.39,<2",
  "opentelemetry-sdk>=1.39,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
  "pyyaml>=6.0.3,<7",
]

[project.scripts]
airp = "airp.cli:main"
airp-mcp = "airp.mcp.server:main"

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-cov>=7,<8", "ruff>=0.15,<1", "mypy>=1.19,<2", "types-PyYAML>=6", "pip-audit>=2.10,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/airp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["kind: requires the provisioned local kind cluster"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S603", "S607"]
"src/airp/mcp/client.py" = ["S603"]
"scripts/provision-kind.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["airp"]

[[tool.mypy.overrides]]
module = ["kubernetes.*"]
ignore_missing_imports = true